<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>同屋 Roomly · 合租生活管家</title>
<meta name="description" content="同屋 Roomly —— 合租生活管家。费用 AA 分摊、清洁值日排班、公共物品登记提醒、室友公约管理，四件事一个地方搞定。">
<meta name="theme-color" content="#17120F">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232A2521'/><text y='72' x='50' text-anchor='middle' font-size='58' fill='white' font-family='sans-serif'>屋</text></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="stage">

  <!-- 手机 -->
  <div class="device">
    <div class="device-screen">

      <div class="statusbar">
        <span id="clock">9:41</span>
        <span class="sb-r">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 8.8 5.2 6.6a3.4 3.4 0 0 1 4.6 0L7.5 8.8Zm0-4.3a6.2 6.2 0 0 0-4.3 1.7L1.6 4.6a8.5 8.5 0 0 1 11.8 0l-1.6 1.6A6.2 6.2 0 0 0 7.5 4.5Z"/></svg>
          <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x=".5" y=".5" width="21" height="10" rx="3" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="7" rx="1.6" fill="currentColor"/><path d="M23 4v3a2 2 0 0 0 0-3Z" fill="currentColor" opacity=".45"/></svg>
        </span>
      </div>

      <header class="topbar" id="topbar"></header>

      <main class="screen" id="screen"></main>

      <nav class="tabbar" id="tabbar">
        <button class="tab is-on" data-tab="home"><span class="ti">🏡</span>首页</button>
        <button class="tab" data-tab="bills"><span class="ti">💸</span>账本</button>
        <button class="tab" data-tab="chores"><span class="ti">🧹</span>值日</button>
        <button class="tab" data-tab="supplies"><span class="ti">🧺</span>物资</button>
        <button class="tab" data-tab="pact"><span class="ti">📜</span>公约</button>
      </nav>

      <div class="mask" id="mask"></div>
      <section class="sheet" id="sheet">
        <div class="sheet-head">
          <div class="grip"></div>
          <h3 id="sheetTitle"></h3>
          <button class="x" id="sheetClose">✕</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </section>

      <div class="toast" id="toast"></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
